# Builds and publishes cross-platform binaries (goreportcard-cli plus the
# linter tools it invokes) to a GitHub Release whenever a version tag is pushed.
# Artifacts are checksummed, SBOM'd (CycloneDX), signed with cosign (keyless),
# and carry SLSA build-provenance attestations.

name: Release

on:
  push:
    tags:
      # Three-segment releases only. "v*" also matched the floating aliases
      # (v1, v1.0), so moving an alias re-fired this workflow and attempted
      # `gh release create v1` with a full cross-platform build.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v1.2.3). Used for archive names."
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless signing + provenance via OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Make the cosign version explicit. This is the installer's own
          # current default, so it does not change which binary we run today —
          # it stops a future installer bump from moving cosign underneath us
          # without the diff saying so.
          cosign-release: v3.0.6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: go test ./check/... ./cmd/...

      - name: Build release archives
        run: scripts/build-release.sh "${{ steps.version.outputs.value }}"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: goreportcard_${{ steps.version.outputs.value }}_sbom.cdx.json
          output-file: dist/goreportcard_${{ steps.version.outputs.value }}_sbom.cdx.json

      - name: Sign archives and checksums (cosign keyless)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.zip checksums.txt *_sbom.cdx.json; do
            [ -e "$f" ] || continue
            echo "signing $f"
            # --output-signature/--output-certificate are deprecated and are
            # ignored under the new bundle format; the bundle carries both.
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done

      - name: Attest build provenance for archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.value }}"
          # Creating a Release through the UI or `gh release create` also
          # creates the tag, which is what triggers this workflow — so the
          # Release frequently already exists by the time we get here, and a
          # bare `gh release create` would fail with "already exists".
          if gh release view "$v" >/dev/null 2>&1; then
            echo "release $v already exists; uploading assets"
            gh release upload "$v" dist/* --clobber
          else
            gh release create "$v" dist/* \
              --title "$v" \
              --generate-notes
          fi
